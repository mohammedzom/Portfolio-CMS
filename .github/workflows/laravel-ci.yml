name: Laravel CI/CD

# Validation runs for every push and pull request on main and dev.
# Production deploys are artifact-based: the exact tested commit is packaged
# (source + --no-dev vendor + Vite build), uploaded with scp to the restricted
# `portfolio-deploy` account and activated by .github/scripts/deploy-release.sh
# with an atomic symlink switch, health checks and automatic rollback.
# Deploys are manual (workflow_dispatch) unless the repository variable
# PORTFOLIO_AUTODEPLOY is set to 'true'.
on:
  workflow_dispatch:
    inputs:
      deploy_to_production:
        description: 'Run the production deployment job for this main commit'
        required: true
        type: boolean
        default: false
      mode:
        description: 'dry-run prepares and verifies the release on the server without switching the site'
        required: true
        type: choice
        options: [dry-run, deploy]
        default: dry-run
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # CI
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Lint deployment scripts
      run: |
        bash -n .github/scripts/deploy-release.sh
        bash -n .github/scripts/build-release.sh
        bash -n .github/deploy/hestia/hestia-bootstrap-releases.sh
        bash -n .github/deploy/hestia/portfolio-fpm-reload
        shellcheck --severity=warning .github/scripts/*.sh .github/deploy/hestia/hestia-bootstrap-releases.sh .github/deploy/hestia/portfolio-fpm-reload

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, json, libxml, openssl, pcre, phar, session, tokenizer, xmlwriter
        coverage: none

    - name: Validate composer.json and composer.lock
      run: composer validate --no-check-publish

    - name: Resolve Composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer downloads
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
        restore-keys: composer-${{ runner.os }}-

    - name: Install Composer dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    # Becomes active automatically once the Blade/Vite frontend (dev) reaches main.
    - name: Setup Node
      if: hashFiles('package-lock.json') != ''
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm

    - name: Build frontend assets
      if: hashFiles('package-lock.json') != ''
      run: |
        npm ci
        npm run build
        test -f public/build/manifest.json

    - name: Prepare environment
      run: |
        cp .env.example .env
        php artisan key:generate

    - name: Check code style (Pint)
      run: vendor/bin/pint --test

    - name: Run tests (in-memory SQLite, see phpunit.xml)
      run: php artisan test

  # Packages the exact tested commit.
  release:
    name: Build immutable release artifact
    needs: test
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.deploy_to_production) ||
       (github.event_name == 'push' && vars.PORTFOLIO_AUTODEPLOY == 'true'))
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, intl, dom, filter, gd, json, libxml, openssl, pcre, phar, session, tokenizer, xmlwriter, pdo_mysql
          coverage: none

      - name: Setup Node
        if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build release archive
        run: bash .github/scripts/build-release.sh "${{ github.sha }}" dist

      - name: Store release for deployment
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-release-${{ github.sha }}
          path: |
            dist/release-${{ github.sha }}.tar.gz
            dist/release-${{ github.sha }}.sha256
          if-no-files-found: error
          retention-days: 7

  # Restricted SSH user, pinned host key, no sudo, no PTY.
  deploy:
    name: Deploy release through restricted SSH
    needs: [test, release]
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.release.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && inputs.deploy_to_production) ||
       (github.event_name == 'push' && vars.PORTFOLIO_AUTODEPLOY == 'true'))
    environment: production
    timeout-minutes: 15
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      SHA: ${{ github.sha }}
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'deploy' }}
      SSH_HOST: ${{ secrets.SERVER_HOST }}
      SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      SSH_USER: ${{ secrets.SERVER_USERNAME }}
    steps:
      - name: Checkout pinned host key
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/deploy

      - name: Download tested artifact
        uses: actions/download-artifact@v4
        with:
          name: portfolio-release-${{ github.sha }}
          path: dist

      - name: Verify artifact checksum
        working-directory: dist
        run: sha256sum --check "release-$SHA.sha256"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY"
          test "$SSH_USER" = portfolio-deploy
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/portfolio_deploy
          chmod 600 ~/.ssh/portfolio_deploy
          cat > ~/.ssh/config <<EOF
          Host portfolio-production
            HostName $SSH_HOST
            Port ${SSH_PORT:-22}
            User $SSH_USER
            IdentityFile ~/.ssh/portfolio_deploy
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $GITHUB_WORKSPACE/.github/deploy/known_hosts
            HostKeyAlias portfolio-production
            ConnectTimeout 20
            ServerAliveInterval 30
          EOF

      - name: Upload artifact with scp
        run: |
          ssh portfolio-production 'install -d -m 700 "$HOME/.portfolio-artifacts"'
          scp "dist/release-$SHA.tar.gz" "dist/release-$SHA.sha256" portfolio-production:.portfolio-artifacts/

      - name: Activate release (${{ env.MODE }})
        run: |
          ssh portfolio-production "set -euo pipefail
            cd \"\$HOME/.portfolio-artifacts\"
            sha256sum --quiet --check release-$SHA.sha256
            tar -xOzf release-$SHA.tar.gz ./.github/scripts/deploy-release.sh > deploy-release-$SHA.sh
            trap 'rm -f deploy-release-$SHA.sh' EXIT
            bash deploy-release-$SHA.sh $MODE $SHA"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/portfolio_deploy
