name: Laravel CI/CD

# Validation runs for every push and pull request on main and dev.
# Production deploy uses restricted SSH user + versioned releases (not the Hestia private checkout).
# Manual deploys are supported; automatic deploy requires PORTFOLIO_AUTODEPLOY=true.
on:
  workflow_dispatch:
    inputs:
      deploy_to_production:
        description: 'Deploy main to the bootstrapped Hestia release directory'
        required: true
        type: boolean
        default: false
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # CI
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate release script syntax
      run: bash -n .github/scripts/deploy-release.sh

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, json, libxml, openssl, pcre, phar, session, tokenizer, xmlwriter
        coverage: none

    - name: Validate composer.json and composer.lock
      run: composer validate --no-check-publish

    - name: Resolve Composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer downloads
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
        restore-keys: composer-${{ runner.os }}-

    - name: Install Composer dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Prepare environment
      run: |
        cp .env.example .env
        php artisan key:generate

    - name: Check code style (Pint)
      run: vendor/bin/pint --test

    - name: Run tests (in-memory SQLite, see phpunit.xml)
      run: php artisan test

  # Package the exact tested Git commit. Node is only required after the Web UI lands on main.
  release:
    name: Build immutable release artifact
    needs: test
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.deploy_to_production == true) ||
       (github.event_name == 'push' && vars.PORTFOLIO_AUTODEPLOY == 'true'))
    permissions:
      contents: read
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4

      - name: Detect Web frontend
        id: frontend
        shell: bash
        run: |
          if [ -f package.json ]; then
            test -f package-lock.json
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node for Web assets
        if: steps.frontend.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build production Web assets
        if: steps.frontend.outputs.present == 'true'
        run: |
          npm ci
          npm run build
          test -f public/build/manifest.json

      - name: Package tracked source and tested Web assets
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p release-source
          git archive HEAD | tar -xf - -C release-source
          rm -rf release-source/public/build
          if [ -f package.json ]; then
            cp -a public/build release-source/public/build
          fi
          bash -n release-source/.github/scripts/deploy-release.sh
          tar -czf "release-${{ github.sha }}.tar.gz" -C release-source .
          sha256sum "release-${{ github.sha }}.tar.gz" > "release-${{ github.sha }}.sha256"

      - name: Store release for deployment
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-release-${{ github.sha }}
          path: |
            release-${{ github.sha }}.tar.gz
            release-${{ github.sha }}.sha256
          if-no-files-found: error
          retention-days: 7

  # No direct Git writes to /home/moh/.../private. No sudo or PTY.
  deploy:
    name: Deploy release through restricted SSH
    needs: [test, release]
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.release.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && inputs.deploy_to_production == true) ||
       (github.event_name == 'push' && vars.PORTFOLIO_AUTODEPLOY == 'true'))
    environment: production
    timeout-minutes: 15
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Download tested artifact
        uses: actions/download-artifact@v4
        with:
          name: portfolio-release-${{ github.sha }}

      - name: Verify artifact checksum
        shell: bash
        run: sha256sum --check "release-${{ github.sha }}.sha256"

      - name: Transfer artifact to portfolio-deploy home
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          source: release-${{ github.sha }}.tar.gz
          target: /home/portfolio-deploy/.portfolio-artifacts

      - name: Activate release (no PTY, no sudo, preflight before cutover)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          request_pty: false
          command_timeout: 10m
          script: |
            bash -s <<'RUN'
            set -Eeuo pipefail
            ARCHIVE="$HOME/.portfolio-artifacts/release-${{ github.sha }}.tar.gz"
            test -f "$ARCHIVE"
            tar -xOzf "$ARCHIVE" ./.github/scripts/deploy-release.sh |
              bash -s -- "${{ github.sha }}"
            RUN
