name: Laravel CI/CD

# Validation runs for every push and pull request on main and dev.
# Deployment is temporarily paused while the new SSH account is configured.
# A read-only SSH check is available manually and for the initial [ssh-check] release.
on:
  workflow_dispatch:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # CI
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, json, libxml, openssl, pcre, phar, session, tokenizer, xmlwriter
        coverage: none

    - name: Validate composer.json and composer.lock
      run: composer validate --no-check-publish

    - name: Resolve Composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer downloads
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
        restore-keys: composer-${{ runner.os }}-

    - name: Install Composer dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Prepare environment
      run: |
        cp .env.example .env
        php artisan key:generate

    - name: Check code style (Pint)
      run: vendor/bin/pint --test

    - name: Run tests (in-memory SQLite, see phpunit.xml)
      run: php artisan test

  # Read-only production SSH authentication check. Never runs on pull requests.
  # Manually: Actions > Laravel CI/CD > Run workflow (main).
  # Also runs once on a main push whose commit message includes [ssh-check].
  ssh-auth-check:
    name: SSH auth check (read-only)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ssh-check]')))
    environment: production
    timeout-minutes: 5
    steps:
      - name: Authenticate without changing server files
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          request_pty: false
          script: |
            set -eu
            test "$(id -un)" = "portfolio-deploy" || { echo "Unexpected SSH identity"; exit 1; }
            id
            echo "SSH authentication successful (no deployment performed)"

  # CD
  deploy:
    name: deploy
    needs: test
    runs-on: ubuntu-latest
    # SAFETY HOLD: Do not deploy until deploy-user permissions and release process are reviewed.
    # Restore a protected deployment condition only after the SSH probe succeeds.
    if: ${{ false }}
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
    - name: Deploy the tested commit to the server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_SSH_PORT }}
        script: |
          bash -s <<'DEPLOY'
          set -Eeuo pipefail

          # Deliberately unquoted, as in the original working deploy: the shell must
          # apply tilde expansion and trim surrounding whitespace in PROJECT_PATH.
          cd ${{ secrets.PROJECT_PATH }}

          TARGET_COMMIT="${{ github.sha }}"
          PREVIOUS_COMMIT="$(git rev-parse HEAD)"
          echo "Previous release: ${PREVIOUS_COMMIT}"
          echo "Target release:   ${TARGET_COMMIT}"

          # Pre-flight checks run before maintenance mode, so a refusal never takes the site down.
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Refusing to deploy: the server working tree has uncommitted changes." >&2
            exit 1
          fi

          git fetch --quiet origin main

          if ! git merge-base --is-ancestor "${PREVIOUS_COMMIT}" "${TARGET_COMMIT}"; then
            echo "Refusing to deploy: ${TARGET_COMMIT} is not a fast-forward of ${PREVIOUS_COMMIT}." >&2
            exit 1
          fi

          rollback() {
            local status=$?
            trap - ERR
            echo "Deployment failed (exit ${status}). Restoring ${PREVIOUS_COMMIT}." >&2
            git reset --hard "${PREVIOUS_COMMIT}" || true
            composer install --no-interaction --prefer-dist --optimize-autoloader || true
            php artisan optimize:clear || true
            php artisan config:cache || true
            php artisan route:cache || true
            php artisan up || true
            echo "Rolled back to ${PREVIOUS_COMMIT}. Review any partially applied migrations manually." >&2
            exit "${status}"
          }

          trap rollback ERR
          php artisan down --retry=60

          git merge --ff-only "${TARGET_COMMIT}"
          composer install --no-interaction --prefer-dist --optimize-autoloader
          php artisan migrate --force
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan queue:restart

          trap - ERR
          php artisan up
          echo "Deployed ${TARGET_COMMIT}."
          DEPLOY
